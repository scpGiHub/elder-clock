<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="長輩大字時鐘">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>長輩大字時鐘</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#080d16;color:#fff;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{height:100svh;padding:calc(env(safe-area-inset-top) + 7px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 7px) calc(env(safe-area-inset-left) + 8px)}
main,.display{height:100%;min-height:0;width:100%}
.display{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:6px}
.panel{background:#101826;border-radius:18px;min-width:0;min-height:0;display:flex;justify-content:center;align-items:center;padding:5px;text-align:center;overflow:hidden}
.time{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.055em;line-height:1;white-space:nowrap;font-size:clamp(85px,24vw,250px)}
.calendar{flex-direction:column;gap:clamp(3px,1.2vh,12px)}
.date,.weekday{font-size:clamp(38px,10vw,90px);font-weight:800;line-height:1.08;white-space:nowrap}
.lunar{font-size:clamp(34px,8.7vw,80px);font-weight:750;line-height:1.12;color:#ffe5a2;white-space:nowrap}
@media(orientation:landscape){
  .display{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .time{font-size:clamp(68px,13vw,200px)}
  .date,.weekday{font-size:clamp(28px,8vh,69px)}
  .lunar{font-size:clamp(25px,7vh,57px)}
  .calendar{gap:clamp(3px,2vh,14px)}
}
@media (orientation:landscape) and (max-height:330px){
  .date,.weekday{font-size:clamp(24px,7.4vh,48px)}
  .lunar{font-size:clamp(23px,6.7vh,44px)}
}
</style>
</head>
<body>
<main>
  <div class="display">
    <section class="panel"><div class="time" id="time">--:--</div></section>
    <section class="panel calendar">
      <div id="date" class="date">載入日期中</div>
      <div id="weekday" class="weekday"></div>
      <div id="lunar" class="lunar">載入農曆中</div>
    </section>
  </div>
</main>
<script>
const tz='Asia/Taipei';
const greg=new Intl.DateTimeFormat('zh-TW-u-ca-gregory',{timeZone:tz,month:'numeric',day:'numeric',weekday:'long'});
const lunar=new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{timeZone:tz,month:'long',day:'numeric'});
const clock=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const parts=(f,d)=>Object.fromEntries(f.formatToParts(d).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
const nums=['零','一','二','三','四','五','六','七','八','九'];
const months=['正','二','三','四','五','六','七','八','九','十','冬','臘'];

function lunarDay(s){
  if(!/^\d+$/.test(s))return s;
  const n=Number(s);if(n===10)return '初十';if(n===20)return '二十';if(n===30)return '三十';
  if(n<1||n>30)return s;
  return (n<11?'初':n<20?'十':'廿')+nums[n%10];
}
function lunarMonth(s){
  if(/^\d+$/.test(s))return (months[Number(s)-1]||s)+'月';
  const m=s.match(/^(\d+)(bis|leap|閏)$/i);
  if(m)return '閏'+(months[Number(m[1])-1]||m[1])+'月';
  return s.endsWith('月')?s:s+'月';
}
function render(){
  const now=new Date(),t=parts(clock,now),g=parts(greg,now);
  document.getElementById('time').textContent=t.hour+':'+t.minute;
  document.getElementById('date').textContent=g.month+'月'+g.day+'日';
  document.getElementById('weekday').textContent=g.weekday;
  try{const l=parts(lunar,now);document.getElementById('lunar').textContent='農曆 '+lunarMonth(l.month)+lunarDay(l.day)}
  catch(e){document.getElementById('lunar').textContent='農曆暫無法顯示'}
}
render();setInterval(render,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
// 使用新的 Service Worker；搭配新版 sw.js 讓更新優先從網路取得。
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script>
</body>
</html>
