<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080d16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="長輩大字時鐘"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>長輩大字時鐘</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;background:#080d16;color:white}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;}body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px)}main{width:min(100%,700px);text-align:center}.time{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.06em;line-height:1.04;font-size:clamp(82px,22vw,180px);white-space:nowrap}.greg{font-size:clamp(33px,8vw,58px);font-weight:700;margin-top:17px}.weekday{font-size:clamp(31px,7vw,55px);font-weight:700;margin-top:12px}.line{height:2px;background:#344252;margin:26px auto;width:83%}.lunar{font-size:clamp(32px,7.8vw,57px);font-weight:750;color:#ffe5a2;line-height:1.35}.year{font-size:clamp(22px,5.4vw,38px);font-weight:600;color:#ffe5a2;margin-top:9px}.ctrl{display:flex;gap:10px;justify-content:center;margin-top:28px}button{border:1px solid #435365;border-radius:12px;padding:10px 14px;font-size:16px;color:white;background:#1d2b3d}button:active{background:#3a536f}.hint{font-size:13px;color:#b4c1d0;min-height:1.5em;margin-top:10px}.large .greg{font-size:clamp(40px,9.5vw,70px)}.large .weekday{font-size:clamp(38px,9vw,66px)}.large .lunar{font-size:clamp(37px,9vw,64px)}@media(orientation:landscape){body{padding:8px 18px}.time{font-size:min(23vh,20vw)}.greg,.weekday{display:inline-block;margin:4px 8px;font-size:min(8vh,5vw)}.line{margin:8px auto}.lunar{font-size:min(9vh,5vw)}.year{font-size:min(6vh,3.5vw)}.ctrl{margin-top:8px}.hint{margin:3px}}@media(max-height:640px) and (orientation:portrait){.time{font-size:19vw}.greg,.weekday,.lunar{font-size:7vw}.line{margin:15px auto}.ctrl{margin-top:15px}}
</style></head><body><main id="clock" aria-live="off"><div id="time" class="time">--:--</div><div class="greg" id="date">國曆讀取中</div><div class="weekday" id="weekday"></div><div class="line"></div><div class="lunar" id="lunar">農曆讀取中</div><div class="year" id="year"></div><div class="ctrl"><button id="font">字體放大</button><button id="seconds">顯示秒數：關</button></div><div id="hint" class="hint">請將 iPhone「自動鎖定」設為「永不」，才能持續顯示</div></main><script>
const zone='Asia/Taipei', digits=['〇','一','二','三','四','五','六','七','八','九'], monthNames=['正','二','三','四','五','六','七','八','九','十','冬','臘'];
const p=(n)=>String(n).padStart(2,'0');let showSeconds=false;let big=false;
const parts=(fmt,d)=>Object.fromEntries(fmt.formatToParts(d).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
const greg=new Intl.DateTimeFormat('zh-TW-u-ca-gregory',{timeZone:zone,year:'numeric',month:'numeric',day:'numeric',weekday:'long'});
const lunarFmt=new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{timeZone:zone,year:'numeric',month:'numeric',day:'numeric'});
const clockFmt=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function lunarText(date){const lp=parts(lunarFmt,date);let mon=lp.month;let day=lp.day;let namedMonth=mon; if(/^\d+$/.test(mon)){const m=Number(mon); namedMonth=monthNames[m-1]||mon;}else{const matched=mon.match(/\d+/);if(matched){namedMonth=monthNames[Number(matched[0])-1]||mon;if(/bis|leap|閏/i.test(mon)) namedMonth='閏'+namedMonth;}}if(!namedMonth.endsWith('月'))namedMonth+='月';let dayTxt=day;if(/^\d+$/.test(day)){const n=Number(day);dayTxt=n===10?'初十':n===20?'二十':n===30?'三十':(n<11?'初':n<20?'十':'廿')+(n%10?digits[n%10]:'');}return {month:namedMonth,day:dayTxt,related:lp.relatedYear||lp.year||''};}
function sexagenary(y){const stem='甲乙丙丁戊己庚辛壬癸', branch='子丑寅卯辰巳午未申酉戌亥',zodiac='鼠牛虎兔龍蛇馬羊猴雞狗豬';const a=((y-4)%10+10)%10,b=((y-4)%12+12)%12;return stem[a]+branch[b]+'年・'+zodiac[b]+'年';}
function render(){const now=new Date(),g=parts(greg,now),t=parts(clockFmt,now);document.getElementById('time').textContent=t.hour+':'+t.minute+(showSeconds?':'+t.second:'');document.getElementById('date').textContent='國曆 '+g.month+'月'+g.day+'日';document.getElementById('weekday').textContent=g.weekday+'・民國'+(Number(g.year)-1911)+'年';try{let l=lunarText(now);document.getElementById('lunar').textContent='農曆 '+l.month+l.day;document.getElementById('year').textContent=l.related?sexagenary(Number(l.related)):'';}catch(e){document.getElementById('lunar').textContent='農曆暫無法顯示';document.getElementById('year').textContent='';}}
document.getElementById('font').onclick=()=>{big=!big;document.body.classList.toggle('large',big);document.getElementById('font').textContent=big?'恢復字體':'字體放大';};document.getElementById('seconds').onclick=()=>{showSeconds=!showSeconds;document.getElementById('seconds').textContent='顯示秒數：'+(showSeconds?'開':'關');render()};render();setInterval(render,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
